spring.application.name=webhook-reliability
spring.datasource.url=jdbc:postgresql://localhost:5432/webhook_reliability
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Kafka Producer
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Kafka Consumer (manual commit per ADR-0001)
spring.kafka.consumer.group-id=webhook-delivery-worker
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=manual

# Outbox Publisher
outbox.poll-interval-ms=1000
outbox.batch-size=100
outbox.topic=webhook-events

# Delivery Worker
delivery.consumer-group=webhook-delivery-worker
delivery.http-timeout-ms=30000
delivery.max-attempts=15